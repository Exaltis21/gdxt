const qEl = document.getElementById('q');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const fBig = document.getElementById('fBig');
const fLevel = document.getElementById('fLevel');
const fDanger = document.getElementById('fDanger');

// populate filter dropdowns
const bigs = [...new Set(DATA.map(d=>d.big).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
for(const b of bigs){
  const o = document.createElement('option');
  o.value=b; o.textContent=b; fBig.appendChild(o);
}
const levels = [...new Set(DATA.map(d=>d.level).filter(Boolean))].sort((a,b)=>{
  const na = a==='拒保'?99:parseInt(a), nb = b==='拒保'?99:parseInt(b);
  return na-nb;
});
for(const l of levels){
  const o = document.createElement('option');
  o.value=l; o.textContent = (l==='拒保'?'拒保':('类别 '+l)); fLevel.appendChild(o);
}

function norm(s){ return (s||'').toLowerCase(); }

function highlight(text, q){
  if(!q) return escapeHtml(text||'');
  const t = text||'';
  const idx = norm(t).indexOf(norm(q));
  if(idx===-1) return escapeHtml(t);
  return escapeHtml(t.slice(0,idx)) + '<mark>' + escapeHtml(t.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(t.slice(idx+q.length));
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(item, q){
  if(!q) return true;
  const hay = norm([item.big,item.sub,item.name,item.code,item.level].join(' '));
  return hay.includes(norm(q));
}

function render(){
  const q = qEl.value.trim();
  const big = fBig.value, level = fLevel.value, danger = fDanger.value;
  let results = DATA.filter(d =>
    matches(d,q) &&
    (!big || d.big===big) &&
    (!level || d.level===level) &&
    (!danger || d.danger===danger)
  );

  countEl.textContent = `共 ${results.length} 条结果`;
  listEl.innerHTML = '';
  emptyEl.style.display = results.length ? 'none' : 'block';

  const frag = document.createDocumentFragment();
  const MAX = 300;
  for(const d of results.slice(0, MAX)){
    const card = document.createElement('div');
    card.className = 'card';
    const dangerTag = d.danger==='是' ? `<span class="tag danger">高危</span>` : '';
    card.innerHTML = `
      <div class="row1">
        <div class="name">${highlight(d.name, q)}</div>
        <div class="code">${highlight(d.code, q)}</div>
      </div>
      <div class="path">${highlight(d.big,q)} ${d.big&&d.sub?'›':''} ${highlight(d.sub,q)}</div>
      <div class="tags">
        <span class="tag level">类别 ${d.level}</span>
        ${dangerTag}
      </div>
    `;
    frag.appendChild(card);
  }
  listEl.appendChild(frag);
  if(results.length > MAX){
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = `结果较多，仅显示前 ${MAX} 条，请输入更精确的关键词`;
    listEl.appendChild(more);
  }
}

let debounceTimer;
function scheduleRender(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 80);
}

qEl.addEventListener('input', scheduleRender);
fBig.addEventListener('change', render);
fLevel.addEventListener('change', render);
fDanger.addEventListener('change', render);

render();
</script>
