<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰康人寿职业分类表查询</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1f2420; --sub:#5b6560;
  --line:#e2e0da; --accent:#2f6f4f; --accent-ink:#ffffff;
  --danger:#b3402f; --hover:#eef4ef;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181a; --card:#1d2225; --ink:#e9ece9; --sub:#9aa39c;
    --line:#2b3134; --accent:#5fb583; --accent-ink:#0d1210;
    --danger:#e0715e; --hover:#232b27;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px; margin:0 auto; padding:20px 16px 40px;}
header{margin-bottom:16px;}
h1{font-size:20px; font-weight:700; margin:0 0 4px; letter-spacing:.2px;}
.meta{color:var(--sub); font-size:13px; margin:0 0 18px;}

.searchbar{position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 12px;}
.searchbar input{
  width:100%; padding:12px 14px; font-size:16px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--ink); outline:none;
}
.searchbar input:focus{ border-color:var(--accent); }

.filters{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.filters select{
  flex:1; min-width:140px; padding:9px 10px; font-size:14px;
  border:1px solid var(--line); border-radius:8px;
  background:var(--card); color:var(--ink);
}

.count{color:var(--sub); font-size:13px; margin:12px 2px 8px;}

.list{display:flex; flex-direction:column; gap:8px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px;
}
.card .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.card .name{font-size:15.5px; font-weight:600;}
.card .code{font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap;}
.card .path{font-size:12.5px; color:var(--sub); margin-top:4px; line-height:1.5;}
.card .tags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.tag{font-size:12px; padding:2px 8px; border-radius:100px; border:1px solid var(--line); color:var(--sub);}
.tag.level{color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:600;}
.tag.danger{color:#fff; background:var(--danger); border-color:var(--danger); font-weight:600;}
mark{background:transparent; color:var(--accent); font-weight:700;}

.empty{text-align:center; color:var(--sub); padding:40px 10px; font-size:14px;}
footer{text-align:center; color:var(--sub); font-size:12px; margin-top:28px;}

.loading{
  display:flex; align-items:center; gap:10px;
  color:var(--sub); font-size:13.5px; padding:24px 4px;
}
.spinner{
  width:16px; height:16px; border-radius:50%;
  border:2px solid var(--line); border-top-color:var(--accent);
  animation:spin .7s linear infinite; flex:none;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.skeleton{ display:flex; flex-direction:column; gap:8px; }
.skel-card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; overflow:hidden; position:relative;
}
.skel-line{
  height:12px; border-radius:6px; background:var(--line);
  position:relative; overflow:hidden;
}
.skel-line.w60{width:60%;} .skel-line.w40{width:40%; margin-top:8px;}
.skel-line.w30{width:30%; margin-top:10px;}
.skel-line::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform:translateX(-100%);
  animation:shimmer 1.3s infinite;
}
@media (prefers-color-scheme: dark){
  .skel-line::after{ background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
}
@keyframes shimmer{ to{ transform:translateX(100%); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>泰康人寿职业分类表查询</h1>
    <p class="meta" id="meta">
      <span class="loading"><span class="spinner"></span>2025年修订版 · 正在加载数据…</span>
    </p>
  </header>

  <div class="searchbar">
    <input id="q" type="text" placeholder="输入关键词搜索，例如：抛光、钻床、财务、0802、个体工商户…" autocomplete="off" disabled>
    <div class="filters">
      <select id="fBig" disabled><option value="">全部行业大类</option></select>
      <select id="fLevel" disabled><option value="">全部职业类别</option></select>
      <select id="fDanger" disabled>
        <option value="">高危：不限</option>
        <option value="是">高危：是</option>
        <option value="否">高危：否</option>
      </select>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div class="list skeleton" id="list">
    <div class="skel-card"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w30"></div></div>
    <div class="skel-card"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w30"></div></div>
    <div class="skel-card"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w30"></div></div>
    <div class="skel-card"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w30"></div></div>
  </div>
  <div class="empty" id="empty" style="display:none;">没有找到匹配的职业，换个关键词试试</div>

  <footer>数据来源：泰康人寿职业分类表（2025年修订版）· 行业大类/二级分类为自动整理结果，个别边界条目可能与原表存在细微差异；职业代码/名称/职业类别/高危标识以原表为准</footer>
</div>

<script>
let DATA = [];
const qEl = document.getElementById('q');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const metaEl = document.getElementById('meta');
const fBig = document.getElementById('fBig');
const fLevel = document.getElementById('fLevel');
const fDanger = document.getElementById('fDanger');

fetch('data.json')
  .then(r => {
    if(!r.ok) throw new Error('data.json load failed: ' + r.status);
    return r.json();
  })
  .then(json => {
    DATA = json;
    metaEl.textContent = `2025年修订版 · 共 ${DATA.length} 条职业记录 · 模糊搜索行业/职业/代码`;
    listEl.classList.remove('skeleton');
    qEl.disabled = false; fBig.disabled = false; fLevel.disabled = false; fDanger.disabled = false;

    const bigs = [...new Set(DATA.map(d=>d.big).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
    for(const b of bigs){
      const o = document.createElement('option');
      o.value=b; o.textContent=b; fBig.appendChild(o);
    }
    const levels = [...new Set(DATA.map(d=>d.level).filter(Boolean))].sort((a,b)=>{
      const na = a==='拒保'?99:parseInt(a), nb = b==='拒保'?99:parseInt(b);
      return na-nb;
    });
    for(const l of levels){
      const o = document.createElement('option');
      o.value=l; o.textContent = (l==='拒保'?'拒保':('类别 '+l)); fLevel.appendChild(o);
    }
    render();
  })
  .catch(err => {
    metaEl.textContent = '数据加载失败：请确认 data.json 与 index.html 在同一目录下，且通过 http(s):// 访问（不能直接双击打开本地文件）';
    listEl.classList.remove('skeleton');
    listEl.innerHTML = '';
    console.error(err);
  });

function norm(s){ return (s||'').toLowerCase(); }

function highlight(text, q){
  if(!q) return escapeHtml(text||'');
  const t = text||'';
  const idx = norm(t).indexOf(norm(q));
  if(idx===-1) return escapeHtml(t);
  return escapeHtml(t.slice(0,idx)) + '<mark>' + escapeHtml(t.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(t.slice(idx+q.length));
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(item, q){
  if(!q) return true;
  const hay = norm([item.big,item.sub,item.name,item.code,item.level].join(' '));
  return hay.includes(norm(q));
}

function render(){
  const q = qEl.value.trim();
  const big = fBig.value, level = fLevel.value, danger = fDanger.value;
  let results = DATA.filter(d =>
    matches(d,q) &&
    (!big || d.big===big) &&
    (!level || d.level===level) &&
    (!danger || d.danger===danger)
  );

  countEl.textContent = `共 ${results.length} 条结果`;
  listEl.innerHTML = '';
  emptyEl.style.display = results.length ? 'none' : 'block';

  const frag = document.createDocumentFragment();
  const MAX = 300;
  for(const d of results.slice(0, MAX)){
    const card = document.createElement('div');
    card.className = 'card';
    const dangerTag = d.danger==='是' ? `<span class="tag danger">高危</span>` : '';
    card.innerHTML = `
      <div class="row1">
        <div class="name">${highlight(d.name, q)}</div>
        <div class="code">${highlight(d.code, q)}</div>
      </div>
      <div class="path">${highlight(d.big,q)} ${d.big&&d.sub?'›':''} ${highlight(d.sub,q)}</div>
      <div class="tags">
        <span class="tag level">类别 ${d.level}</span>
        ${dangerTag}
      </div>
    `;
    frag.appendChild(card);
  }
  listEl.appendChild(frag);
  if(results.length > MAX){
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = `结果较多，仅显示前 ${MAX} 条，请输入更精确的关键词`;
    listEl.appendChild(more);
  }
}

let debounceTimer;
function scheduleRender(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 80);
}

qEl.addEventListener('input', scheduleRender);
fBig.addEventListener('change', render);
fLevel.addEventListener('change', render);
fDanger.addEventListener('change', render);
</script>
</body>
</html>
