/* ============ 构建索引 ============ */
const ROWS = RAW.map(([code, name, cls, ind, hr]) => ({ code, name, cls, ind, hr }));
document.getElementById('total').textContent = ROWS.length;

const tbody  = document.getElementById('tbody');
const input  = document.getElementById('q');
const selCls = document.getElementById('cls');
const countEl = document.getElementById('count');
const hintEl  = document.getElementById('hint');

function norm(s){ return String(s == null ? '' : s).toLowerCase(); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlight(text, terms){
  let out = escapeHtml(text);
  if (!terms.length) return out;
  terms.forEach(t => {
    if (!t) return;
    try {
      out = out.replace(new RegExp('(' + escapeReg(escapeHtml(t)) + ')', 'gi'), '<mark>$1</mark>');
    } catch(e){}
  });
  return out;
}

function clsPill(cls){
  const map = { '5':'pill p5', '6':'pill p6', '拒保':'pill pR', '担保':'pill pR' };
  const k = map[cls] || 'pill';
  return '<span class="' + k + '">' + escapeHtml(cls) + '类</span>';
}

function render(){
  const q = input.value.trim();
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const cf = selCls.value;

  const hits = ROWS.filter(r => {
    if (cf && r.cls !== cf) return false;
    if (!terms.length) return true;
    const hay = norm(r.code + ' ' + r.name + ' ' + r.ind + ' ' + r.cls);
    return terms.every(t => hay.indexOf(t) !== -1);
  });

  countEl.textContent = hits.length;
  hintEl.textContent = terms.length ? ('关键词：' + terms.join(' + ')) : '显示全部职业（可按上方输入框或类别筛选）';

  if (!hits.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty"><span>🔍</span>没有找到匹配的职业，请换个关键词试试</td></tr>';
    return;
  }

  const parts = hits.map(r => {
    const nameHtml = highlight(r.name, terms) + (r.hr ? '<span class="hr-badge">医疗险高危</span>' : '');
    return '<tr>' +
      '<td>' + highlight(r.ind, terms) + '</td>' +
      '<td class="cls">' + clsPill(r.cls) + '</td>' +
      '<td>' + nameHtml + '</td>' +
      '<td class="code">' + highlight(r.code, terms) + '</td>' +
    '</tr>';
  });
  tbody.innerHTML = parts.join('');
}

let timer = null;
input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 90);
});
selCls.addEventListener('change', render);
document.getElementById('clear').addEventListener('click', () => {
  input.value = '';
  selCls.value = '';
  input.focus();
  render();
});
document.querySelectorAll('.tips code').forEach(el => {
  el.addEventListener('click', () => {
    input.value = el.textContent;
    selCls.value = '';
    render();
    input.focus();
  });
});

render();
</script>
</body>
</html>
